<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="reactorGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6f7ff;stop-opacity:1" />
    </radialGradient>
    <filter id="reactorGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#ffffff00" />

  <!-- Outer segments -->
  <g filter="url(#reactorGlow)">
    <polygon points="100,25 78,45 122,45" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="145,35 125,55 142,75" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="170,75 150,95 160,120" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="160,135 142,145 125,165" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="130,170 110,160 100,180" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="70,170 90,160 100,180" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="40,135 58,145 75,165" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="30,75 50,95 40,120" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="55,35 75,55 58,75" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
    <polygon points="70,25 78,45 122,45" fill="#e6f7ff" stroke="#66ccff" stroke-width="3"/>
  </g>

  <!-- Center circle -->
  <circle cx="100" cy="100" r="38" fill="#ffffff" stroke="#66ccff" stroke-width="5" filter="url(#reactorGlow)"/>
</svg>